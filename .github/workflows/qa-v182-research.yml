name: Cloud research appendix and navigation checks
on:
  push:
    branches: [qa/v182-research-20261003-a1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official Chinese fonts and select cloud Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Build and test approved public content
        run: python scripts/build.py && python scripts/validate.py && node scripts/test_dashboard.cjs && node scripts/test_status.cjs && node scripts/test_publication.cjs
      - name: Real Chrome navigation, status and interrupted archive flows
        run: node scripts/browser_navigation.cjs
      - name: Real Chrome research reader, tables, outcomes and downloads
        run: node scripts/browser_research_appendix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mydotwork-v182-qa-a2
          path: |
            output/navigation-review/*.png
            output/navigation-review/browser-results.json
            output/research-review/**/*.png
            output/research-review/**/*.json
          retention-days: 14
