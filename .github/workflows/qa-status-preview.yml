name: Cloud status and archive preview
on:
  push:
    branches: [qa/v180-status-preview-20261003]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official Chinese fonts and select cloud Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Build reviewed snapshot and run all data tests
        run: python scripts/build.py && python scripts/validate.py && node scripts/test_dashboard.cjs && node scripts/test_status.cjs
      - name: Verify three appearances and real archive controls in cloud browser
        run: node scripts/browser_navigation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mydotwork-v180-status-preview
          path: |
            output/navigation-review/*.png
            output/navigation-review/browser-results.json
          retention-days: 14
